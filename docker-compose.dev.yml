# 개발용 인프라만 (Postgres + MinIO + Redis). apps/api/.env 의 기본 포트와 일치.
# 사용: npm run infra:up  /  npm run infra:down
# ※ 앱(api/worker)은 네이티브로 실행(npm run dev:api, npm run worker).
#    전체 스택을 이미지로 빌드해 돌리려면 docker-compose.yml 을 사용.

# 프로젝트 이름을 풀스택(docker-compose.yml=snaply-stack)과 분리 —
# 같으면 저쪽 `docker compose down`이 이 인프라까지 지운다.
name: snaply-dev

services:
  # 로컬 Postgres (TEAM.md §4 옵션 A) — 마이그레이션을 각자 로컬에서 자유롭게 돌리기 위함.
  # 공유 Supabase로 전환하려면 .env 의 DATABASE_URL/DIRECT_URL 만 교체하면 된다.
  postgres:
    image: postgres:16-alpine
    container_name: snaply-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snaply
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: snaply-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9100:9000" # API (S3_ENDPOINT=http://localhost:9100)
      - "9101:9001" # 콘솔 (http://localhost:9101, minioadmin/minioadmin123)
    volumes:
      - minio-dev:/data

  redis:
    image: redis:7-alpine
    container_name: snaply-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev:/data

volumes:
  pgdata-dev:
  minio-dev:
  redis-dev:
