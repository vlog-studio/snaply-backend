name: Deploy

# main 브랜치 머지 시 자동 배포. 실제 배포 대상/자격증명은 리포지토리 Secrets로 주입.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-worker/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'scripts/smoke-images.sh'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 스모크를 통과한 **그 이미지**만 GHCR 로 간다. 빌드해서 바로 push 하던 때는
    # Dockerfile 이 깨져도 CI 가 초록이었고 실행되지 않는 이미지가 :latest 로 올라갔다
    # (실제로 두 번 났다 — BGM 자산 누락, BGM_DIR 경로 어긋남. backlog E-4).
    name: Build, smoke & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: snaply-api:ci
      WORKER_IMAGE: snaply-ai-worker:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push 하지 않고 로컬 데몬으로 load 한다 — 검사 대상과 배포 대상이 같아야 한다.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build AI worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-worker/Dockerfile
          load: true
          tags: ${{ env.WORKER_IMAGE }}
          cache-from: type=gha,scope=ai-worker
          cache-to: type=gha,scope=ai-worker,mode=max

      - name: Smoke test images
        run: SKIP_BUILD=1 scripts/smoke-images.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 다시 빌드하지 않고 검사한 이미지에 태그만 붙여 올린다.
      - name: Push images
        run: |
          set -euo pipefail
          repo=ghcr.io/${{ github.repository }}
          for pair in "$API_IMAGE api" "$WORKER_IMAGE ai-worker"; do
            set -- $pair
            docker tag "$1" "$repo/$2:latest"
            docker tag "$1" "$repo/$2:${{ github.sha }}"
            docker push "$repo/$2:latest"
            docker push "$repo/$2:${{ github.sha }}"
          done

  migrate-and-deploy:
    name: Migrate DB & deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    # 배포 자격증명이 설정된 경우에만 실행 (미설정 시 스킵)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }

      - run: npm ci
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # TODO: 실제 배포 대상에 맞춰 구성 (예: Fly.io / Render / ECS 등)
      - name: Deploy
        run: echo "배포 단계는 인프라 확정 후 연결하세요 (이미지 태그 ${{ github.sha }})."
