name: Deploy

# main 브랜치 머지 시 자동 배포. 실제 배포 대상/자격증명은 리포지토리 Secrets로 주입.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-worker/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'docker-compose.aws.yml'
      - 'deploy/*.sh'
      - 'deploy/batches.cron'
      - 'deploy/aws/**'
      - 'scripts/smoke-images.sh'
      - 'scripts/ensure-minio-image.sh'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 스모크를 통과한 **그 이미지**만 GHCR 로 간다. 빌드해서 바로 push 하던 때는
    # Dockerfile 이 깨져도 CI 가 초록이었고 실행되지 않는 이미지가 :latest 로 올라갔다
    # (실제로 두 번 났다 — BGM 자산 누락, BGM_DIR 경로 어긋남. backlog E-4).
    name: Build, smoke & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: snaply-api:ci
      WORKER_IMAGE: snaply-ai-worker:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push 하지 않고 로컬 데몬으로 load 한다 — 검사 대상과 배포 대상이 같아야 한다.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build AI worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-worker/Dockerfile
          load: true
          tags: ${{ env.WORKER_IMAGE }}
          cache-from: type=gha,scope=ai-worker
          cache-to: type=gha,scope=ai-worker,mode=max

      # 스모크 스택의 MinIO 도 GHCR 미러에서 받는다 — 그래서 로그인이 스모크보다 먼저다.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 미러가 아직 없으면(같은 push 에서 MinIO image 워크플로가 도는 중이면) 여기서 빌드한다.
      - name: Prepare MinIO image
        run: scripts/ensure-minio-image.sh

      - name: Smoke test images
        run: SKIP_BUILD=1 scripts/smoke-images.sh

      # 다시 빌드하지 않고 검사한 이미지에 태그만 붙여 올린다.
      - name: Push images
        run: |
          set -euo pipefail
          repo=ghcr.io/${{ github.repository }}
          for pair in "$API_IMAGE api" "$WORKER_IMAGE ai-worker"; do
            set -- $pair
            docker tag "$1" "$repo/$2:latest"
            docker tag "$1" "$repo/$2:${{ github.sha }}"
            docker push "$repo/$2:latest"
            docker push "$repo/$2:${{ github.sha }}"
          done

  deploy:
    # **사내 서버의 self-hosted runner 에서 돈다.** GitHub 이 빌려주는 컴퓨터는 사내망 안으로
    # 들어올 수 없으므로, 서버가 GitHub 쪽으로 먼저 연결을 걸어 일을 받아온다 — 방화벽에
    # 들어오는 구멍을 내지 않는다(docs/deployment.md).
    name: Deploy to the on-prem server
    needs: build-and-push
    runs-on: [self-hosted, snaply]
    # 서버 준비가 끝나기 전에는 돌지 않는다. 저장소 Variables 에서 켠다.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    concurrency:
      group: deploy-onprem
      cancel-in-progress: false
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      WORKER_IMAGE: ghcr.io/${{ github.repository }}/ai-worker:${{ github.sha }}
      # 시크릿 파일. 컨테이너에 넣을 값(`env_file`)과 compose 파일의 `${…}` 치환값이 모두 여기서 온다.
      # 치환은 `env_file` 을 읽지 않으므로 compose 를 부를 때마다 `--env-file` 로도 넘긴다(docs/deployment.md §1-2).
      SNAPLY_ENV_FILE: /etc/snaply/snaply.env
      # cron 의 배치·백업이 도는 체크아웃(deploy/batches.cron 의 SNAPLY_DIR). 돌고 있는 이미지 태그를 여기 남긴다.
      SNAPLY_DIR: /opt/snaply
      COMPOSE: -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4

      # 못 읽으면 compose 가 치환 단계에서 값이 비었다고만 하고 멈춘다 — 원인을 먼저 말한다.
      - name: Check the secrets file
        run: |
          if [ ! -r "$SNAPLY_ENV_FILE" ]; then
            echo "시크릿 파일을 읽을 수 없다: $SNAPLY_ENV_FILE — runner 계정이 읽을 수 있어야 한다(docs/deployment.md §1-2)" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그를 :latest 가 아니라 커밋 SHA 로 고정한다 — 재시작할 때마다 다른 버전이 뜨지
      # 않아야 하고, 문제가 생겼을 때 어느 커밋이 돌고 있었는지 말할 수 있어야 한다.
      - name: Pull images
        run: docker compose --env-file "$SNAPLY_ENV_FILE" $COMPOSE pull

      # 마이그레이션이 먼저다. 실패하면 여기서 멈추고 **이전 버전이 계속 돈다** —
      # 반쯤 적용된 스키마 위에 새 코드가 뜨는 것이 제일 나쁘다.
      - name: Apply database migrations
        run: docker compose --env-file "$SNAPLY_ENV_FILE" $COMPOSE run --rm migrate

      - name: Start services
        run: docker compose --env-file "$SNAPLY_ENV_FILE" $COMPOSE up -d --remove-orphans

      # 배치·백업(cron)이 지금 돌고 있는 버전과 같은 이미지를 쓰도록 기록해 둔다. cron 은 runner 의 작업
      # 폴더가 아니라 SNAPLY_DIR 에서 돌므로 거기에 쓴다 — 작업 폴더에 남기면 cron 이 찾지 못한다.
      - name: Record running images
        run: |
          printf 'API_IMAGE=%s\nWORKER_IMAGE=%s\n' "$API_IMAGE" "$WORKER_IMAGE" \
            > "$SNAPLY_DIR/deploy/.current-images"

      - name: Wait for health
        run: |
          set -euo pipefail
          port="${{ vars.API_HOST_PORT || '3000' }}"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS "http://127.0.0.1:${port}/health" 2>/dev/null || true)
            case "$body" in *'"db":"connected"'*) echo "정상: $body"; exit 0 ;; esac
            sleep 2
          done
          echo "기동 확인 실패 (마지막 응답: ${body:-없음})" >&2
          docker compose --env-file "$SNAPLY_ENV_FILE" $COMPOSE logs --tail=120 api
          exit 1

      # 오래된 이미지가 디스크를 채운다. 돌고 있는 것은 건드리지 않는다.
      - name: Prune old images
        if: always()
        run: docker image prune -af --filter "until=168h"

  deploy-aws:
    # **AWS 공모전 서버(EC2)의 self-hosted runner 에서 돈다**(docs/deployment-aws.md). runner 가 GitHub 쪽으로
    # 먼저 연결해 일을 받아오므로 인바운드도, GitHub 에 둘 AWS 키도 없다 — 시크릿은 인스턴스 역할로 읽는다.
    # 저장소가 public 이라 runner 는 main 의 이 워크플로(push)만 받는다(deploy/aws/runner-job-started.sh).
    name: Deploy to the AWS server
    needs: build-and-push
    runs-on: [self-hosted, snaply-aws]
    # 서버 준비(deploy/aws/install.sh · 시크릿)가 끝나기 전에는 돌지 않는다. 저장소 Variables 에서 켠다.
    if: ${{ vars.DEPLOY_AWS_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      WORKER_IMAGE: ghcr.io/${{ github.repository }}/ai-worker:${{ github.sha }}
      # 이 잡 · cron 배치 · 손 작업이 모두 쓰는 곳. /data 라 인스턴스를 교체해도 남고 매일 스냅샷된다.
      SNAPLY_DIR: /data/compose
      SNAPLY_ENV_FILE: /data/compose/.env
      # compose 가 직접 읽는다 — `-f` 를 매번 붙이지 않는다.
      COMPOSE_FILE: docker-compose.aws.yml
    steps:
      - uses: actions/checkout@v4

      # compose 파일과 배치 스크립트를 cron 이 부르는 자리로 옮긴다 — deploy/ 를 고친 커밋이 서버에서 git pull
      # 없이 반영된다. 덮어쓰기만 한다: 지우면 .current-images 가 사라져 그 사이의 배치가 멈춘다.
      - name: Sync deploy files
        run: |
          set -euo pipefail
          install -m 644 docker-compose.aws.yml "$SNAPLY_DIR/docker-compose.aws.yml"
          mkdir -p "$SNAPLY_DIR/deploy"
          cp -R deploy/. "$SNAPLY_DIR/deploy/"

      # Secrets Manager → env 파일. 빈 값은 빠진다 — 이유는 스크립트 머리말.
      - name: Write the secrets file
        run: deploy/aws/write-env.sh

      # GHCR 패키지는 비공개다(저장소는 public 이어도). 잡마다 주어지는 토큰으로 받는다.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        working-directory: ${{ env.SNAPLY_DIR }}
        run: docker compose --env-file "$SNAPLY_ENV_FILE" pull

      # 마이그레이션이 먼저다. 실패하면 여기서 멈추고 **이전 버전이 계속 돈다**.
      - name: Apply database migrations
        working-directory: ${{ env.SNAPLY_DIR }}
        run: docker compose --env-file "$SNAPLY_ENV_FILE" run --rm migrate

      - name: Start services
        working-directory: ${{ env.SNAPLY_DIR }}
        run: docker compose --env-file "$SNAPLY_ENV_FILE" up -d --remove-orphans

      # 배치 · 백업(cron)이 지금 돌고 있는 버전과 같은 이미지를 쓰도록 남긴다.
      - name: Record running images
        run: |
          printf 'API_IMAGE=%s\nWORKER_IMAGE=%s\n' "$API_IMAGE" "$WORKER_IMAGE" \
            > "$SNAPLY_DIR/deploy/.current-images"

      - name: Wait for health
        working-directory: ${{ env.SNAPLY_DIR }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3000/health 2>/dev/null || true)
            case "$body" in *'"db":"connected"'*) echo "정상: $body"; exit 0 ;; esac
            sleep 2
          done
          echo "기동 확인 실패 (마지막 응답: ${body:-없음})" >&2
          docker compose --env-file "$SNAPLY_ENV_FILE" logs --tail=120 api
          exit 1

      # /data 는 50GB 이고 이미지는 배포마다 약 3GB 다 — 사내 서버(7일)보다 짧게 둔다. 돌고 있는 것은 남는다.
      - name: Prune old images
        if: always()
        run: docker image prune -af --filter "until=72h"

  # (구) migrate-and-deploy 잡은 제거했다. DB 가 사내망 안으로 들어가면서 GitHub 이 빌려주는
  # 컴퓨터에서는 닿을 수 없게 됐고, 마이그레이션은 위 deploy 잡이 서버 안에서 실행한다.
