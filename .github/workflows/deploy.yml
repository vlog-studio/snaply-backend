name: Deploy

# main 브랜치 머지 시 자동 배포. 실제 배포 대상/자격증명은 리포지토리 Secrets로 주입.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-worker/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest,ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      - name: Build & push AI worker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ai-worker
          push: true
          tags: ghcr.io/${{ github.repository }}/ai-worker:latest,ghcr.io/${{ github.repository }}/ai-worker:${{ github.sha }}

  migrate-and-deploy:
    name: Migrate DB & deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    # 배포 자격증명이 설정된 경우에만 실행 (미설정 시 스킵)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }

      - run: npm ci
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # TODO: 실제 배포 대상에 맞춰 구성 (예: Fly.io / Render / ECS 등)
      - name: Deploy
        run: echo "배포 단계는 인프라 확정 후 연결하세요 (이미지 태그 ${{ github.sha }})."
