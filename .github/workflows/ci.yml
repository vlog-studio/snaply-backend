name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Build / Typecheck / Lint (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  python:
    name: Syntax check (AI Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/ai-worker

      - name: Compile check
        run: python -m compileall src
        working-directory: apps/ai-worker
