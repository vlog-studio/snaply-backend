name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Build / Typecheck / Lint (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  api-tests:
    name: Integration tests (API)
    runs-on: ubuntu-latest
    # 통합 테스트는 실제 Postgres/Redis/MinIO 를 그대로 쓴다(mock 아님).
    # MinIO 는 service container 가 아니라 아래 step 에서 docker run 으로 띄운다 —
    # service container 는 command 를 지정할 수 없는데 minio/minio 는 `server /data` 가 필요하다.
    # (계정 삭제 purge 테스트가 S3 prefix 삭제를 실제로 호출한다 — test/account-deletion.test.ts)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snaply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      # 포트·크리덴셜은 docker-compose.dev.yml / test/setup 과 동일 (9100 → 컨테이너 9000)
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live -o /dev/null && exit 0
            sleep 1
          done
          echo "MinIO 가 기동되지 않았습니다" >&2
          docker logs minio >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      # 루트에서 turbo 로 실행한다. turbo.json 의 test 태스크가 dependsOn: ["^build"] 이므로
      # 의존 패키지(@vlog-studio/shared-types)가 먼저 빌드된다.
      # `npm test -w apps/api` 로 turbo 를 우회하면 shared-types 의 dist 가 없어
      # "Failed to resolve entry for package" 로 실패한다(실제로 CI 에서 발생).
      # turbo 는 스크립트를 패키지 디렉터리에서 실행하므로 apps/api/vitest.config.ts 도 정상 적용된다.
      - name: Integration tests
        run: npm test

  python:
    name: Syntax check (AI Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/ai-worker

      - name: Compile check
        run: python -m compileall src
        working-directory: apps/ai-worker

      - name: Unit tests
        run: python -m unittest discover -s tests
        working-directory: apps/ai-worker
