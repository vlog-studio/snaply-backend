name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Build / Typecheck / Lint (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  api-tests:
    name: Integration tests (API)
    runs-on: ubuntu-latest
    # 통합 테스트는 실제 Postgres/Redis 를 그대로 쓴다(mock 아님).
    # MinIO 는 필요 없다 — S3 를 실제로 호출하는 테스트가 없고, Dev A 의 storage 테스트도
    # presign URL 문자열만 검증한다(네트워크 미사용).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snaply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      # 테스트는 apps/api 기준으로 실행해야 vitest.config.ts 가 적용된다.
      # (다른 위치에서 실행하면 DATABASE_URL 이 테스트 DB를 가리키지 않는다 —
      #  docs/integrations-handover.md §2 참고)
      - name: Integration tests
        run: npm test -w apps/api

  python:
    name: Syntax check (AI Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/ai-worker

      - name: Compile check
        run: python -m compileall src
        working-directory: apps/ai-worker

      - name: Unit tests
        run: python -m unittest discover -s tests
        working-directory: apps/ai-worker
