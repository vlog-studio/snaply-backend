# 로컬 개발용 전체 스택 (api + ai-worker + redis + postgres + minio)
# 컨테이너로 테스트 서버를 잠깐 띄울 때 쓴다. 상시 개발은 docker-compose.dev.yml + 네이티브 실행.
#
# 전체 스택 실행·업데이트: npm run stack
# API만 실행: npm run stack:up (의존 서비스와 migration은 자동으로 따라온다)
#
# 환경변수는 `apps/api/.env` 를 env_file 로 읽어 베이스로 깔고, 아래 environment 로 덮는다.
# `${VAR}` 보간도 같은 파일을 읽도록 stack:* 스크립트가 `--env-file apps/api/.env` 를 넘긴다.
# compose 규격상 environment 가 env_file 보다 우선한다 — 개인 .env 의 로컬 주소(localhost:9100 등)가
# 컨테이너 네트워크 주소를 덮지 않는 이유가 이것이다.
# 이미지에는 .env 가 들어가지 않는다(.dockerignore) — 운영과 같은 "주입" 경로를 그대로 쓴다.

# 프로젝트 이름을 dev 인프라(docker-compose.dev.yml=snaply-dev)와 분리 —
# 같으면 `docker compose down`이 dev 인프라 컨테이너/볼륨까지 지운다.
name: snaply-stack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snaply
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 최초 설치와 pull 후 업데이트 모두 같은 경로를 쓴다.
  # `migrate deploy`는 이미 적용된 migration을 건너뛰며, 실패하면 API와 워커를 시작하지 않는다.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snaply
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/snaply
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # Supabase·결제·SNS 자격증명은 여기서 온다. 없으면 뜨긴 하지만 인증이 동작하지 않는다.
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      API_PORT: "3000"
      # 인프라는 컨테이너 네트워크 기준으로 덮는다 (.env 의 localhost:* 를 무시)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snaply
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/snaply
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9200}
      S3_BUCKET_NAME: snaply
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: ap-northeast-2
      # 미디어 공개 URL 은 이 스택의 MinIO 를 가리켜야 한다 — .env 의 CloudFront 도메인을 지운다.
      CLOUDFRONT_DOMAIN: ""
      # 외부 연동은 기본 mock. 실키 경로를 확인해야 할 때만 해당 줄을 지운다.
      SNS_MOCK: "true"
      BILLING_MOCK: "true"
      SENTRY_DSN: ""
    ports:
      - "${API_HOST_PORT:-3000}:3000"   # 호스트 포트가 점유됐다면 API_HOST_PORT로 변경

  ai-worker:
    build:
      context: ./apps/ai-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snaply
      EDIT_QUEUE_NAME: edit-jobs
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9200}
      S3_BUCKET_NAME: snaply
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: ap-northeast-2
      # api 와 같은 이유로 CloudFront 를 비운다 — 미디어는 이 스택의 MinIO 에 있다.
      CLOUDFRONT_DOMAIN: ""
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      SENTRY_DSN: ""

volumes:
  pgdata:
  miniodata:
